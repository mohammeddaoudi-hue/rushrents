<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="rr-modus" content="statisch">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mijn reservatie · Rush Rents</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="/rushrents/img/logo-rr.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" href="/rushrents/fonts/Archivo-Variable.woff2" crossorigin>
<style>@view-transition{navigation:auto}</style>
<link rel="stylesheet" href="/rushrents/css/site.css">
<link rel="stylesheet" href="/rushrents/css/reserveren.css">
</head>
<body>
<header class="nav is-vast">
  <div class="wrap nav-in">
    <a class="logo" href="/rushrents/" aria-label="Rush Rents, naar de startpagina">
      <img class="logo-rr" src="/rushrents/img/logo-rr.svg" alt="" width="174" height="146">
      <img class="logo-woord" src="/rushrents/img/logo-woord.svg" alt="Rush Rents" width="311" height="29">
    </a>
    <nav class="nav-links" aria-label="Hoofdmenu"><a href="/rushrents/#wagens">Alle wagens</a></nav>
    <div class="nav-acties">
      <a class="ico-link toon-altijd" data-wa href="/rushrents/" target="_blank" rel="noopener" aria-label="Stuur een bericht via WhatsApp"><svg class="ico" aria-hidden="true"><use href="/rushrents/img/iconen.svg#whatsapp"/></svg></a>
    </div>
  </div>
</header>
<main class="pagina">
  <div class="wrap smal">
    <h1>Mijn reservatie</h1>
    <form class="paneel zoek" id="zoek" novalidate>
      <label class="invoer"><span>Reservatienummer</span><input name="nr" autocomplete="off" autocapitalize="characters" maxlength="20" required></label>
      <label class="invoer"><span>Achternaam of gsm-nummer van de reservatie</span><input name="sleutel" autocomplete="off" maxlength="60" required></label>
      <button class="btn btn-wit" type="submit">Zoek</button>
      <p class="fout" id="zoek-fout" role="alert" hidden></p>
    </form>
    <div id="gevonden"></div>
  </div>
</main>

<footer class="voet" id="contact">
  <div class="wrap voet-in">
    <a class="voet-logo" href="/rushrents/" aria-label="Rush Rents, naar de startpagina"><img src="/rushrents/img/logo-rr.svg" alt="" width="174" height="146" loading="lazy"></a>
    <nav class="voet-kol is-menu" aria-label="Voetmenu">
      <h2>Site</h2>
      <a href="/rushrents/#wagens">Wagens</a>
      <a href="/rushrents/#huren">Zo huur je</a>
      <a href="/rushrents/reservatie/">Mijn reservatie</a>
    </nav>
    <div class="voet-kol is-contact">
      <h2>Contact</h2>
      <a data-wa href="/rushrents/" target="_blank" rel="noopener"><svg class="ico ico-wa" aria-hidden="true"><use href="/rushrents/img/iconen.svg#whatsapp"/></svg><span>WhatsApp <span data-telefoon></span></span></a>
      <a data-mail href="/rushrents/" hidden></a>
      <span data-locatie-lang>Kortrijk</span>
    </div>
    <div class="voet-kol is-volg">
      <h2>Volg Rush Rents</h2>
      <div class="socials" id="socials"></div>
    </div>
  </div>
  <div class="voet-merk" aria-hidden="true" data-onthul></div>
  <div class="wrap voet-onder">
    <p id="voet-bedrijf" hidden></p>
    <nav aria-label="Juridisch"><a href="/rushrents/voorwaarden/" data-voorwaarden-link hidden>Huurvoorwaarden</a><a href="/rushrents/fotocredits/">Fotocredits</a></nav>
  </div>
</footer>
<script type="module" src="/rushrents/js/reservatie.js"></script>
</body>
</html>
